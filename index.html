.gbar button{width:32px;height:32px;border:3px solid var(--ink);background:var(--panel);color:#fff;font-size:0;display:grid;place-items:center;cursor:pointer;padding:0}
#resPanel,.mbox{background:var(--panel);border:4px solid #0a1a3a;box-shadow:inset 0 0 0 3px #1d3a7a}
.rrow{background:#0a1634;border:3px solid var(--ink)}.rrow.win{background:#0f3558;border-color:var(--sky)}
.fcard{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 2px #1d3a7a}.fcard.first{background:#3d2f08;box-shadow:inset 0 0 0 3px var(--gold)}
.seg button{border:4px solid var(--ink);background:#0a1634;color:#fff;font-weight:700;font-family:Fredoka,sans-serif;font-size:12px;cursor:pointer;padding:10px}
.seg button.sel{background:var(--frame)}
.toast{background:var(--panel);border:4px solid var(--ink);box-shadow:inset 0 0 0 2px var(--sky)}.toast.err{box-shadow:inset 0 0 0 2px #ff7d8f}.toast.ok{box-shadow:inset 0 0 0 2px var(--good)}
.mk{width:26px;height:26px;border:3px solid #fff;box-shadow:3px 3px 0 var(--ink);font-size:0}
.mk.flag{background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/10px 10px!important}
.leaflet-container{font-family:'Nunito',monospace}
#spectOv{background:var(--panel);border:3px solid var(--ink)}
.bdg{display:inline-flex;height:28px;flex:none;--b:#5b6163;--bd:#26292a;--t:#e8f0e8}
.bdg .bi{width:28px;display:grid;place-items:center;background:var(--b);border:3px solid var(--bd);box-shadow:inset 0 0 0 2px #ffffff40,inset 0 -3px 0 #00000040}
.bdg .bt{padding:0 8px;display:flex;align-items:center;background:var(--b);border:3px solid var(--bd);border-left:0;box-shadow:inset 0 0 0 2px #ffffff30,inset 0 -3px 0 #00000040;color:var(--t);font-size:14px;font-weight:700;letter-spacing:.06em;text-shadow:2px 2px 0 #00000066}
.bdg.host{--b:#b3123a;--bd:#4a0b12;--t:#ffe0e5}
.bdg.mini .bt{display:none}
/* ===== avatar (kare profil) ===== */
.avw{box-sizing:content-box;display:block;flex:none;width:64px;height:64px;border:3px solid var(--ink);background:#0b1a3d;image-rendering:pixelated;box-shadow:0 0 0 3px #1d3a7a;transition:box-shadow .08s}
.avw.talk{box-shadow:0 0 0 3px #49e05a}
.pc .avw,.rrow .avw,.fcard .avw,.pl .avw{width:64px;height:64px}
.rrow{grid-template-columns:70px 1fr}
.pl{gap:10px}

/* ===== ANA EKRAN ===== */
#home.active{display:flex;flex-direction:column}
.title{position:relative;z-index:2;flex:1;width:100%;max-width:400px;margin:0 auto;padding:0 18px clamp(96px,22vh,190px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4vh,22px);text-align:center}
#logoCv{display:block;image-rendering:pixelated;max-width:100%;filter:drop-shadow(0 6px 0 #04102bcc)}
.title .tag{margin:0;max-width:290px;color:var(--mut);font-size:15px;line-height:1.3}
.who{display:grid;justify-items:center;gap:20px;width:100%;margin-top:4px}
.avSlot{position:relative;border:0;background:none;padding:0;cursor:pointer;line-height:0;color:inherit}
.avSlot .avw{width:128px;height:128px;border-width:4px;box-shadow:0 0 0 4px var(--frame),0 8px 0 4px #07122b}
.avSlot .avw.talk{box-shadow:0 0 0 4px #49e05a,0 8px 0 4px #07122b}
.avSlot:hover .avw,.avSlot:focus-visible .avw{box-shadow:0 0 0 4px var(--gold),0 8px 0 4px #07122b}
.avSlot:active{transform:translateY(3px)}
.avPen{position:absolute;right:-16px;bottom:-8px;width:38px;height:38px;display:grid;place-items:center;background:var(--gold);border:4px solid var(--ink);box-shadow:inset 0 3px 0 #fff7,inset 0 -3px 0 #0003,0 3px 0 var(--ink)}
.nameIn{text-align:center;font-size:20px!important;color:var(--gold)!important;letter-spacing:.04em}
.nameIn::placeholder{color:#5d77b5}
.menu{display:grid;gap:12px;width:100%}
.menu .btn{width:100%}
.menu .joinbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.menu .joinbox input{min-width:0;text-align:center;letter-spacing:.25em;font-family:Fredoka,sans-serif;text-transform:uppercase;font-size:15px}
.menu .joinbox .btn{width:auto}
#land{position:fixed;left:0;right:0;bottom:0;width:100%;height:clamp(80px,20vh,180px);image-rendering:pixelated;z-index:1;pointer-events:none}
@media(max-height:720px){.avSlot .avw{width:96px;height:96px}.who{gap:16px}}

/* ===== MANTI STÜDYOSU + AMİRAL BATTI ===== */
.modal{grid-template-columns:minmax(0,1fr)}
#avEd{z-index:60}
#avEd .avbox{width:min(440px,100%);justify-self:center}
#avPrev{width:160px;height:160px;image-rendering:pixelated;display:block;margin:6px auto 12px;background:#0b1a3d;border:4px solid var(--ink);box-shadow:0 0 0 3px var(--sky)}
#avEd .lb{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.06em;margin-top:8px}
.avSw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0}
.avSw button{height:34px;border:3px solid var(--ink);cursor:pointer;padding:0}
.avSw button.on{outline:3px solid var(--gold);outline-offset:1px}
.avStep{display:flex;align-items:center;gap:8px;margin:8px 0}
.avStep .lb{flex:0 0 74px;margin:0}
.avStep b{flex:1;text-align:center;font-size:13px}
.avStep .btn{padding:6px 14px;font-size:18px}
.avTg.on{background:var(--gold);color:#3a2300}
.lobName{flex:1;min-width:0;padding:6px 8px!important;font-size:14px!important}
.pc .rm{padding:4px 10px;font-size:13px}
#bs .wrap{max-width:640px;padding-bottom:30px}
.bsChips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px}
.bsChip{flex:none;display:grid;justify-items:center;gap:2px;padding:6px;border:3px solid var(--ink);background:var(--panel);font-size:11px;cursor:pointer;min-width:62px;max-width:84px}
.bsChip .avw{width:40px;height:40px;border-width:2px;box-shadow:none}
.bsChip b{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsChip span{color:var(--gold);font-size:9px;letter-spacing:1px;height:11px}
.bsChip.turn{border-color:var(--gold)}
.bsChip.sel{box-shadow:0 0 0 3px var(--sky)}
.bsChip.dead{opacity:.35;filter:grayscale(1)}
.bsMsg{min-height:44px;text-align:center;font-family:Fredoka,sans-serif;font-size:13px;line-height:1.35;color:var(--gold);padding:4px 6px 10px;text-shadow:2px 2px 0 var(--ink)}
canvas.bsBoard{width:min(100%,560px);aspect-ratio:1;display:block;margin:0 auto;image-rendering:pixelated;border:4px solid var(--ink);box-shadow:0 0 0 3px var(--frame);touch-action:manipulation;background:#0a1a3d}
#bsMiniBox{display:none;gap:12px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
canvas#bsMine{width:min(60vw,240px)}
#bsTray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.bsBreak{flex-basis:100%;height:0}
.bsShip{font-size:12px;padding:8px 10px}
.bsShip.on{background:var(--gold);color:#3a2300}
.bsShip.done{opacity:.55}
.bsCover,.bsEnd{position:fixed;inset:0;z-index:70;background:#030a1ef5;display:none;place-items:center;text-align:center;padding:20px}
.bsCover.on,.bsEnd.on{display:grid}
.avw.bsBig{width:128px;height:128px;margin:0 auto;border-width:4px}

/* ===== MOD KARTLARI + SESLİ SOHBET + AMİRAL REHBERİ ===== */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.modes.sm{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcard{display:grid;gap:6px;align-content:start;text-align:left;padding:6px;border:4px solid var(--ink);background:#0a1634;color:#fff;cursor:pointer;box-shadow:inset 0 0 0 2px #1d3a7a,0 4px 0 var(--ink);font-family:Fredoka,sans-serif;transition:transform .08s}
.mcard:hover{filter:brightness(1.15)}
.mcard:active{transform:translateY(3px)}
.mcard canvas.thm{width:100%;aspect-ratio:16/9;display:block;image-rendering:pixelated;border:3px solid var(--ink);background:#0b1a3d}
.mcard b{font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding:2px 2px 0}
.mcard small{font-family:'Nunito',sans-serif;font-size:13px;line-height:1.2;color:var(--mut);padding:0 2px 2px;min-height:2.4em}
.mcard.sel{background:#3d2f08;box-shadow:inset 0 0 0 3px var(--gold),0 4px 0 var(--ink)}
.mcard.sel b{color:var(--gold)}
.mcard.sel canvas.thm{border-color:var(--gold)}
.modes.sm .mcard b{font-size:11px;text-align:center}
.modes.sm .mcard small{display:none}
.subT{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.06em;margin-top:12px;font-family:Fredoka,sans-serif}
.vbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.vp{display:flex;align-items:center;gap:8px;min-width:0;background:#0d1a40d9;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #1d3a7a;padding:3px 10px 3px 3px;pointer-events:none}
.vp .avw{width:44px;height:44px}
.vp b{font-family:Fredoka,sans-serif;font-size:11px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hudPlayers{max-height:calc(100vh - 190px);overflow:hidden}
#hudPlayers .vp{margin-top:2px}
.bsHint{min-height:34px;text-align:center;font-size:14px;line-height:1.25;color:#cfe3ff;padding:0 6px 8px}
.bsLbl{font-family:Fredoka,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sky);text-align:center;margin:2px 0 8px}
.bsFleet{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 10px}
.bsF{display:inline-flex;align-items:center;gap:3px;font-family:Fredoka,sans-serif;font-size:10px;padding:4px 6px;border:3px solid var(--ink);background:var(--panel)}
.bsF em{font-style:normal;margin-right:4px;color:var(--mut)}
.bsF i{width:9px;height:9px;background:#6b7a99;border:1px solid var(--ink);display:block}
.bsF i.h{background:#ff5252}
.bsF.sunk{border-color:#ff5252}
.bsF.sunk i{background:#ff5252}
.bsF.sunk em{text-decoration:line-through;color:#ff9aa8}
.hlp p{margin:8px 0;font-size:15px;line-height:1.3}

/* ===== AMİRAL BATTI: solda kontroller, sağda büyük deniz ===== */
#bs{overflow:hidden}#bs.active{display:flex;flex-direction:column;height:100dvh}
#bs .top{padding:6px 14px;flex:none}#bs .logo{font-size:18px}
#bs .wrap{flex:1;min-height:0;width:100%;max-width:none;padding:0 14px 12px;display:flex;gap:16px}
#bsL{flex:0 0 min(330px,38vw);min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}#bsL>*{flex:none}
#bsR{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
canvas#bsMain{width:min(100%,calc(100dvh - 84px));height:auto;aspect-ratio:1;max-width:100%}
.bsChips{flex-direction:column;overflow:visible;padding:0;gap:6px}
.bsChip{position:relative;display:flex;align-items:center;gap:10px;width:100%;max-width:none;min-width:0;padding:5px 10px}
.bsChip .avw{width:34px;height:34px;flex:none}.bsChip b{flex:1;max-width:none;text-align:left;font-size:13px}.bsChip span{position:static;height:auto}
.bsMsg{min-height:46px;text-align:left;padding:6px 8px;font-size:12px;background:#0a1634d9;border:3px solid var(--ink)}.bsHint{min-height:0;text-align:left;font-size:13px;padding:0 2px}
#bsL .bsLbl{text-align:left;margin:2px 0 0}.bsFleet{justify-content:flex-start;margin:0}.bsF{padding:2px 5px}
#bsTray{justify-content:flex-start;margin:0;gap:6px}.bsShip{padding:6px 8px;font-size:11px}
#bsMiniBox{margin:0;justify-content:flex-start}canvas#bsMine{width:min(100%,150px)}
.bsA{display:inline-block;padding:1px 8px;border:3px solid var(--ink);background:var(--c);color:#fff;text-shadow:2px 2px 0 #000;margin:0 2px}
.bsChip.atk{border-color:#ffd23f;box-shadow:0 0 0 3px #ffd23f}.bsChip.tgt{border-color:#ff5252;box-shadow:0 0 0 3px #ff5252}
.bsChip.atk::after,.bsChip.tgt::after{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:10px Fredoka,sans-serif;padding:2px 5px;background:#000;color:#ffd23f}
.bsChip.atk::after{content:'ATAR'}.bsChip.tgt::after{content:'HEDEF';color:#ff7b7b}
@media (max-aspect-ratio:1/1){#bsR{justify-content:center}#bs .wrap{flex-direction:column;gap:6px}#bsL{flex:none;max-height:44%}#bsR{flex:1}canvas#bsMain{width:min(100%,calc(56dvh - 40px))}.bsChips{flex-direction:row;overflow-x:auto;flex-wrap:nowrap}.bsChip{width:auto;flex:none;padding:3px 6px}.bsChip b{font-size:11px}.bsChip.atk::after,.bsChip.tgt::after{top:-9px;right:auto;left:50%;transform:translateX(-50%)}}
/* ===== VAMPİR KÖYLÜ ===== */
#vk{overflow:hidden;background:#58ab37}#vkCv{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
#vk{--p:#f6efd6;--b:#3a2615;font-family:Nunito,system-ui,sans-serif;font-weight:800;color:var(--b)}
#vkTop{position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:flex-start;gap:8px;z-index:3;pointer-events:none}
#vkTop>*{pointer-events:auto}#vkRoles{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.vkRc{position:relative;display:grid;place-items:center;width:34px;height:34px;background:var(--p);border:3px solid var(--b);border-radius:9px;box-shadow:0 3px 0 #0003}
.vkRc.me{border-color:var(--t);box-shadow:0 0 0 3px var(--t)}.vkRc i{position:absolute;right:-5px;bottom:-6px;font:800 11px Nunito,sans-serif;background:var(--b);color:#fff;border-radius:8px;padding:0 5px;font-style:normal}
#vkPill{display:flex;align-items:center;gap:6px;background:var(--p);border:3px solid var(--b);border-radius:14px;padding:4px 12px;font-size:15px;box-shadow:0 3px 0 #0003}#vkTm{min-width:20px;text-align:right;color:#c0392b}
.vkBtns{display:flex;gap:6px;flex:1;justify-content:flex-end}.vkb{width:36px;height:36px;display:grid;place-items:center;background:var(--p);border:3px solid var(--b);border-radius:10px;cursor:pointer;box-shadow:0 3px 0 #0003;padding:0}.vkb.d{background:#d9453d}.vkb.live{background:#9be15d}
#vkMe{position:absolute;top:56px;left:8px;z-index:3;display:grid;gap:4px;max-width:46vw}.vkMeC{display:flex;align-items:center;gap:6px;background:var(--p);border:3px solid var(--t);border-radius:12px;padding:4px 10px;font-size:15px;box-shadow:0 3px 0 #0003}
.vkSub{background:#f6efd6e6;border:2px solid var(--b);border-radius:8px;padding:2px 8px;font-size:12px}
#vkMsg{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:3;max-width:min(520px,calc(100vw - 190px));text-align:center;font-size:14px;line-height:1.25;background:var(--p);border:3px solid var(--b);border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 #0003;pointer-events:none}#vkMsg:empty{display:none}
#vkLog{position:absolute;top:56px;right:8px;width:min(230px,70vw);max-height:calc(100% - 150px);overflow-y:auto;background:var(--p);border:3px solid var(--b);border-radius:12px;padding:6px;z-index:4;display:none;box-shadow:0 3px 0 #0003}
#vkLog.show{display:block}@media (min-width:900px){#vkLog{display:block}#vkLogBtn{display:none}}
#vkLog .lg{display:flex;gap:6px;align-items:flex-start;border-bottom:2px dashed #3a261533;padding:5px 2px;font-size:12px;line-height:1.2}#vkLog .lg:last-child{border:0}#vkLog .ic{flex:none;margin-top:1px}
#vkBar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:3;text-align:center;background:var(--p);border:3px solid var(--b);border-radius:14px;padding:8px 16px;font-size:15px;box-shadow:0 3px 0 #0003;max-width:calc(100vw - 20px)}
#vkBar .btn{padding:4px 12px;font-size:13px;margin-left:6px}
.ic{vertical-align:middle;flex:none}

/* ===== SADE TEMA (parlama yok, düz renk) ===== */
:root{--ink:#1d1a40;--frame:#4a4590;--panel:#35317a;--panel2:#2b2862;--card2:#2a2759;--light:#ece8fb;--lightsh:#b3aadf;--sky:#b9b2f0;--gold:#e8b94a;--acc:#6cc7a8;--good:#4fa86f;--red:#d9484b;--txt:#f1eefc;--mut:#a9a3d6;--bg:#2e2a63;--line:#1d1a40}
html,body{background:#2e2a63;font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:16px;-webkit-font-smoothing:auto}
h1,h2,h3,.fr,.code,#timer,.logo,.btn,.bdg,label,.tag2,#roundInfo,.pbar,.avEdit,.avTabs button{font-family:'Fredoka','Nunito',sans-serif;letter-spacing:.02em;text-transform:none}
#bg{background:#2e2a63}#bg::before,#bg i{display:none!important}
.grad,.code{color:#fff!important;text-shadow:none!important}
.logo{font-size:22px}
.btn{background:var(--light);color:#2b2457;border:0;font-size:16px;text-transform:none;text-shadow:none;padding:12px 20px;box-shadow:0 4px 0 var(--lightsh)}
.btn:hover{filter:none;background:#fff}.btn:active{transform:translateY(4px);box-shadow:none}
.btn.primary{background:var(--acc);color:#10372c;box-shadow:0 4px 0 #3d9279}.btn.alt{background:var(--light);color:#2b2457}
.btn.danger{background:var(--red);color:#fff;box-shadow:0 4px 0 #9c2e31}.btn.live{background:var(--good);color:#fff;box-shadow:0 4px 0 #357a4f}
.icon,.gbar button,.vkb{background:var(--light);color:#2b2457;border:0;box-shadow:0 3px 0 var(--lightsh)}
.icon.live{background:var(--good)}
input[type=text],select{background:var(--card2);border:3px solid #1d1a40;box-shadow:none;color:#fff}
input[type=text]:focus,select:focus{border-color:var(--acc);box-shadow:none}
.card,#resPanel,.mbox{background:var(--panel);border:3px solid #1d1a40;box-shadow:none}
.card h3{color:#fff;font-size:15px;text-transform:none}
.pc,.rrow,.fcard,.vp,.mcard{background:var(--card2);border:3px solid #1d1a40;box-shadow:none}
.mcard{color:#fff;font-family:'Fredoka',sans-serif}.mcard.sel,.fcard.first,.rrow.win{background:#3d3a85;border-color:var(--acc);box-shadow:none}
.tag2{background:#1d1a40;color:#d8d3f5}
.pbar{background:var(--card2);border:3px solid #1d1a40;box-shadow:none}
#timer,#roundInfo{background:var(--panel);border:3px solid #1d1a40;box-shadow:none}#timer.urgent{background:var(--red)}
.toast,.toast.err,.toast.ok{background:var(--panel);border:3px solid #1d1a40;box-shadow:none}.toast.err{border-color:var(--red)}.toast.ok{border-color:var(--acc)}
.seg button{background:var(--card2);border:3px solid #1d1a40;font-family:'Fredoka',sans-serif;text-transform:none}.seg button.sel{border-color:var(--acc);background:#3d3a85}
.avw,#avPrev,.avSlot .avw{background:#2a2759;border:3px solid #1d1a40;box-shadow:none}
.avw.talk,.avSlot .avw.talk{border-color:var(--good);box-shadow:none}.avSlot:hover .avw{border-color:var(--acc);box-shadow:none}
#guessMapBox,canvas.bsBoard{border:3px solid #1d1a40;box-shadow:none}
.bsChip.sel{box-shadow:none;outline:3px solid #fff}.bsChip.atk,.bsChip.tgt{box-shadow:none}
.warn{background:var(--card2);border:3px solid #1d1a40;color:var(--txt)}
/* vampir köylü HUD */
#vk{--p:#f3ecd4;--b:#2e2418}
.vkRc,.vkb,#vkPill,#vkMsg,#vkBar,#vkLog,.vkMeC{border-width:3px;box-shadow:none}
.vkRc.me{box-shadow:none;outline:3px solid var(--t)}
#vkPill{padding:4px 14px;gap:8px;min-width:96px;justify-content:center}
#vkPill #vkPh{font:600 15px Fredoka,sans-serif}
#vkTm{font:700 22px Fredoka,sans-serif;color:#2e2418;min-width:26px;text-align:center}
#vkTm.low{color:#c0392b}

/* ===== kenarlıksız, yumuşak köşeli ===== */
*,*::before,*::after{border-radius:12px!important;border-color:transparent!important;box-shadow:none!important;text-shadow:none!important;outline:0!important}
html,body,.screen,#bg,#panoHost,#pano,#pano *,#vkCv,#game,#panoBlock,.leaflet-container,.leaflet-container *,.leaflet-tile,#vk{border-radius:0!important}
.mk,.avw,.vkMeC i{border-radius:50%!important}.avw{border-radius:14px!important}
#panoHost:not(.on){opacity:0!important;pointer-events:none!important}

function haversine(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol * ST.master, A.ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, A.ctx.currentTime + d);
  o.connect(g); g.connect(A.master); o.start(); o.stop(A.ctx.currentTime + d);
}

/* Kötü konum hafızası: 🔄'e bastığın (iç mekan/boş) yerler bu cihazda saklanır ve bir daha çıkmaz. */
const bkey = (la, ln) => (+la).toFixed(5) + ',' + (+ln).toFixed(5);
function badSet() { try { return new Set(JSON.parse(localStorage.getItem('bad_locs') || '[]')); } catch (e) { return new Set(); } }
function addBad(la, ln) { try { const b = badSet(); b.add(bkey(la, ln)); localStorage.setItem('bad_locs', JSON.stringify([...b])); } catch (e) {} }

function getRandomLocation(region, wide) {
  const f = REGIONS[region] || null; const bad = badSet(); let pool = CITIES.filter(c => (!f || f.includes(c[0])) && !bad.has(bkey(c[1], c[2])));
  if (!pool.length) pool = CITIES.filter(c => !f || f.includes(c[0]));
  const c = pool[Math.floor(Math.random() * pool.length)];
  const span = wide ? 0.3 : 0;
  const j = () => (Math.random() - 0.5) * span;
  return { lat: +(c[1] + j()).toFixed(5), lng: +(c[2] + j()).toFixed(5) };
}

/* ses seviyesi ölçer: mikrofon ve uzak oyuncular için ortak (0=sessiz … 3=yüksek) */
function vuStep(o) {
  o.an.getByteTimeDomainData(o.buf);
  let sum = 0; for (const v of o.buf) { const d = (v - 128) / 128; sum += d * d; }
  const r = Math.sqrt(sum / o.buf.length), now = performance.now(), prev = o.lvl || 0;
  o.lvl = r > prev ? prev * .3 + r * .7 : prev * .65 + r * .35;
  o.pk = Math.max(.06, (o.pk || .06) * .995, o.lvl);
  const l = o.lvl, q = l / o.pk;
  let tk = l < .012 ? 0 : q < .3 ? 1 : q < .6 ? 2 : 3;
  if (tk > 0) o.hold = now + 280; else if (now < (o.hold || 0)) tk = 1;   // rozet titremesin
  return tk;
}
function micPoll() {
  if (!VOICE.on) { VOICE.talk = 0; VOICE.lvl = 0; return; }
  VOICE.talk = vuStep(VOICE);
}
const hph = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) | 0; return ((h >>> 0) % 628) / 100; };

    if (cv._k === k && cv._data === data) return;

async function micToggle() {
  if (VOICE.busy) return;
  if (VOICE.on) {
    try { VOICE.stream.getTracks().forEach(x => x.stop()); } catch (e) {}
    try { VOICE.ctx.close(); } catch (e) {}
    VOICE.on = false; VOICE.talk = 0; hangAll(); netSend({ t: 'mic', id: UID, on: false }); micUI(); return;
  }
  VOICE.busy = true; let ctx = null;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: 'NoAPI' };
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume().catch(() => {}); ensureAudio();
    const tries = [{ echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }, { echoCancellation: true, noiseSuppression: true }, true];
    let stream = null, err = null;
    for (const a of tries) {
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: a }); break; }
      catch (e) { err = e; if (e && ['NotAllowedError', 'SecurityError', 'NotFoundError'].includes(e.name)) break; await sleep(350); }
    }
    if (!stream) throw err || { name: 'Unknown' };
    await ctx.resume().catch(() => {});
    const src = ctx.createMediaStreamSource(stream);
    VOICE.ctx = ctx; VOICE.stream = stream;
    VOICE.an = ctx.createAnalyser(); VOICE.an.fftSize = 512; src.connect(VOICE.an);
    VOICE.buf = new Uint8Array(VOICE.an.fftSize); VOICE.on = true;
    const tr = stream.getAudioTracks()[0];
    if (tr) tr.onended = () => { if (VOICE.on && VOICE.stream === stream) { micToggle(); toast(Lg('Mikrofon bağlantısı koptu', 'Microphone disconnected'), 'err'); } };
    callAll();
  } catch (e) {
    try { ctx && ctx.close(); } catch (x) {}
    const n = e && e.name, tr = ST.lang === 'tr';
    toast(n === 'NotAllowedError' || n === 'SecurityError' ? (tr ? 'Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden izin ver.' : 'Mic permission denied. Allow it from the address bar.')
      : n === 'NotFoundError' ? (tr ? 'Mikrofon bulunamadı.' : 'No microphone found.')
      : n === 'NotReadableError' ? (tr ? 'Mikrofon başka bir uygulama tarafından kullanılıyor.' : 'Mic is used by another app.')
      : !window.isSecureContext ? (tr ? 'Mikrofon için sayfa https üzerinden açılmalı.' : 'Open the page over https for the mic.')
      : (tr ? 'Mikrofon açılamadı, tekrar dene.' : 'Could not open mic, try again.'), 'err', 4500);
  }
  VOICE.busy = false; micUI();
}

/* ======================================================================
   ODA AĞI + SESLİ SOHBET  (PeerJS · API anahtarı gerekmez)
   Kurucu 'geoio-KOD' kimliğiyle açılır, katılanlar ona veri bağlantısı kurar.
   Mikrofon açık olan herkes odadaki herkesi arar (mesh), karşıdaki sesi çalar.

const NET = { on: false, host: false, peer: null, code: null, pid: null, conns: {}, hostConn: null, out: {}, rx: {}, joined: false, jt: 0 };
let peerLoad = null;
function loadPeerJS() {
  if (window.Peer) return Promise.resolve(true);
  if (peerLoad) return peerLoad;
  const urls = ['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];

    for (const u of urls) {

      if (ok && window.Peer) return true;

}

function netSend(msg, except) {

    if (NET.host) Object.values(NET.conns).forEach(c => { if (c !== except && c.open) c.send(msg); });
    else if (NET.hostConn && NET.hostConn.open) NET.hostConn.send(msg);

}

/* uzak ses: çal + seviyesini ölç */
function rxDrop(uid) {
  const o = NET.rx[uid]; if (!o) return;
  try { o.a.pause(); o.a.srcObject = null; o.a.remove(); } catch (e) {}
  try { o.src && o.src.disconnect(); o.ag && o.ag.disconnect(); o.cm && o.cm.disconnect(); o.vg && o.vg.disconnect(); o.lm && o.lm.disconnect(); } catch (e) {}
  delete NET.rx[uid]; if (S.players[uid]) S.players[uid].talk = 0;
}
function rxAttach(uid, stream) {

  a.play().catch(() => { const f = () => { a.play().catch(() => {}); removeEventListener('pointerdown', f); }; addEventListener('pointerdown', f); });

  try { ensureAudio(); o.src = A.ctx.createMediaStreamSource(stream); o.an = A.ctx.createAnalyser(); o.an.fftSize = 512; o.src.connect(o.an); o.buf = new Uint8Array(512);
    /* Ses sabitleme: kısık konuşan da aynı seviyede duyulsun. Film sesi bu zincirden geçmez. */
    const c = A.ctx;
    o.ag = c.createGain(); o.ag.gain.value = 2; o.g = 2;
    o.cm = c.createDynamicsCompressor(); o.cm.threshold.value = -32; o.cm.knee.value = 24; o.cm.ratio.value = 6; o.cm.attack.value = .004; o.cm.release.value = .25;

    o.src.connect(o.ag); o.ag.connect(o.cm); o.cm.connect(o.vg); o.vg.connect(o.lm); o.lm.connect(A.master);

}
function netPoll() { for (const uid in NET.rx) { const o = NET.rx[uid]; const tk = o.an ? vuStep(o) : 0; if (S.players[uid]) S.players[uid].talk = tk;
    if (o.ag && o.lvl > .009) { const want = Math.max(.7, Math.min(16, .09 / o.lvl)); o.g += (want - o.g) * (want < o.g ? .35 : .05); o.ag.gain.setTargetAtTime(o.g, A.ctx.currentTime, .05); } } }

function buildAvatars() {}
function getName() {
  const n = $('#inName').value.trim().slice(0, 14);
  if (!n) { toast(t('needName'), 'err'); $('#inName').focus(); return null; }
  ST.name = n; saveST(); return n;
}

function playersArr() {
  return Object.values(S.players);
}

function renderLobby() {
  setTimeout(avRepaintAll, 0);
  $('#lobCode').textContent = S.code;
  $('#lobCount').textContent = playersArr().length + '/' + S.meta.max;
  const sMax = $('#sMax'); if (!sMax.options.length) for (let i = 2; i <= 15; i++) sMax.add(new Option(i, i));
  sMax.value = S.meta.max;
  $('#lobPlayers').innerHTML = playersArr().map((p, i) => `
    <div class="pc" style="--c:${p.color}">
      ${avCanvas(p.id)}
      ${p.local && p.id !== UID ? `<input type="text" class="lobName" data-nm="${p.id}" value="${esc(p.name)}" maxlength="14">` : `<b>${esc(p.name)}</b>`}
      ${p.id === UID ? `<span class="tag2">${t('you')}</span>` : ''}${p.bot ? '<span class="tag2">BOT</span>' : ''}
      ${badge(i === 0 ? 'host' : 'player')}
      ${p.id !== UID && (p.bot || p.local) ? `<button class="btn danger rm" data-rm="${p.id}">✕</button>` : ''}
    </div>
  `).join('');
  bsLobbyUI();
}

function createRoom() {
  const name = getName(); if (!name) return false;
  S.code = Math.random().toString(36).substring(2, 7).toUpperCase();
  S.meta = { max: 10, hp: 6000, mode: 'move', limit: 60, region: 'world', game: 'geo' };
  S.players = { [UID]: { id: UID, name, av: ST.avData || AV.defaults(), color: PALETTE[0], hp: S.meta.hp } };
  renderLobby();
  show('lobby');
  prefetch(S.meta.region);
  return true;
}

function startSoloGame() {
  const name = getName(); if (!name) return;
  netTeardown();
  createRoom();
  startGame();
}

function startGame() {
  S.score = 0;
  S.round = { n: 1 };
  show('game');
  initGameUI();
  startRound();
}

function baseLayer(map) {
  L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=' + ST.lang + '&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: '0123' }).addTo(map);
}

function initGameUI() {
  if (!S.gmap) {
    S.gmap = L.map('guessMap', { center: [25, 10], zoom: 1, minZoom: 1, zoomControl: false, attributionControl: false, maxBounds: [[-85, -180], [85, 180]] });
    baseLayer(S.gmap);
    S.gmap.on('click', e => placeGuess(e.latlng));
  }
  setTimeout(() => S.gmap.invalidateSize(), 100);
}

async function startRound() {
  const r = S.round;
  S.myGuess = null;
  if (S.marker) { S.marker.remove(); S.marker = null; }
  clearInterval(S.timer);
  $('#roundInfo').textContent = t('round') + ' ' + r.n + ' · ★ ' + (S.score || 0);
  $('#alertTxt').textContent = '';
  renderHud();
  renderGuessBtn();

  const x = await takeLocation(S.meta.region);
  r.loc = x.loc;
  await x.frame.loadP;
  const old = S.cur; S.cur = x.frame;
  x.frame.style.visibility = 'visible';
  if (old && old !== x.frame) old.remove();
  $('#alertTxt').textContent = '';
  prefetch(S.meta.region);   // bir sonraki turun görüntüsü şimdiden arka planda yüklenmeye başlar

  let remaining = S.meta.limit;
  $('#timer').textContent = fmtTime(remaining);
  S.timer = setInterval(() => {
    remaining--;
    $('#timer').textContent = fmtTime(remaining);
    if (remaining <= 0) {
      clearInterval(S.timer);
      submitGuess();
    }
  }, 1000);
}

function mkIcon(color, txt) {
  const flag = txt === '🏁';
  return L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13], html: `<div class="mk${flag ? ' flag' : ''}" style="background:${color || '#fff'}"></div>` });
}

function placeGuess(ll) {
  if (S.myGuess) return;
  if (!S.marker) S.marker = L.marker(ll, { icon: mkIcon(PALETTE[0], '') }).addTo(S.gmap);
  else S.marker.setLatLng(ll);
  renderGuessBtn();
}

function renderGuessBtn() {
  const b = $('#btnGuess');
  if (S.myGuess) { b.disabled = true; b.textContent = t('waitingOthers'); }
  else if (!S.marker) { b.disabled = true; b.textContent = t('placePin'); }
  else { b.disabled = false; b.textContent = t('guess'); }
}

function submitGuess() {
  if (S.myGuess) return;
  S.myGuess = S.marker ? S.marker.getLatLng() : { lat: 0, lng: 0 };
  clearInterval(S.timer);
  showResult();
}

function showResult() {
  const r = S.round;
  const locLL = L.latLng(r.loc.lat, r.loc.lng);
  const guessLL = L.latLng(S.myGuess.lat, S.myGuess.lng);
  const dist = S.marker ? haversine(r.loc, S.myGuess) : CONFIG.NO_GUESS_KM;
  const dmg = Math.round(dist * 0.8);
  
  const pts = S.marker ? Math.round(5000 * Math.exp(-dist / 1492.7)) : 0;
  S.score = (S.score || 0) + pts;
  S.players[UID].hp = Math.max(0, S.players[UID].hp - dmg);

  $('#resultOv').style.display = 'block';
  if (S.rmap) S.rmap.invalidateSize();
  if (!S.rmap) {
    S.rmap = L.map('resMap', { center: [20, 0], zoom: 2, minZoom: 1, zoomControl: false, attributionControl: false });
    L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=' + ST.lang + '&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: '0123' }).addTo(S.rmap);
  }
  S.rObjs.forEach(o => o.remove()); S.rObjs = [];
  
  const m1 = L.marker(locLL, { icon: mkIcon('#fff', '🏁') }).addTo(S.rmap);
  S.rObjs.push(m1);
  if (S.marker) {
    const m2 = L.marker(guessLL, { icon: mkIcon(PALETTE[0], '') }).addTo(S.rmap);
    const line = L.polyline([guessLL, locLL], { color: PALETTE[0], weight: 3, dashArray: '6 8' }).addTo(S.rmap);
    S.rObjs.push(m2, line);
    S.rmap.fitBounds(L.latLngBounds([locLL, guessLL]), { padding: [50, 50] });
  } else {
    S.rmap.setView(locLL, 4);
  }
  setTimeout(() => S.rmap.invalidateSize(), 50);
  
  $('#resPanel').innerHTML = `
    <h2 class="grad">${t('resultTitle', { n: r.n })}</h2>
    <div class="fr" style="font-size:34px;color:var(--acc)">+${pts} ${ST.lang === 'tr' ? 'puan' : 'pts'}</div>
    <div class="muted">${ST.lang === 'tr' ? 'Toplam' : 'Total'}: ★ ${S.score} · ${dmg === 0 ? t('youWon') : t('youLost', { n: dmg })}</div>
    <div class="rrow win">
      ${avCanvas(UID)}
      <div>
        <div class="nm"><span>${esc(ST.name)}</span><span>${fmtDist(dist)}</span></div>
        <div class="pbar"><i style="width:${(S.players[UID].hp / S.meta.hp) * 100}%"></i><b>${S.players[UID].hp}</b></div>
      </div>
    </div>
    <button class="btn primary" id="btnNextRound" style="margin-top:auto">${t('start')}</button>
  `;
  
  avRepaintAll();
  $('#btnNextRound').onclick = () => {
    $('#resultOv').style.display = 'none';
    if (S.players[UID].hp <= 0) {
      showFinal();
    } else {
      S.round.n++;
      startRound();
    }
  };
}

function showFinal() {
  show('final'); setTimeout(avRepaintAll, 0);
  $('#champName').textContent = ST.name;
  $('#podium').innerHTML = `
    <div class="fcard first">
      <span class="pos">1.</span>
      ${avCanvas(UID)}
      <div class="inf">${esc(ST.name)}<small>★ ${S.score} ${ST.lang === 'tr' ? 'puan' : 'pts'} · ${S.round ? t('round') + ' ' + S.round.n : ''}</small></div>
    </div>
  `;
}

function renderHud() {
  setTimeout(avRepaintAll, 0);
  const me = S.players[UID];
  if (!me) return;
  $('#hudPlayers').innerHTML = `
    <div class="pl">
      ${avCanvas(me.id)}${badge(isHost(me) ? 'host' : 'player', true)}
      <div class="pbar"><i style="width:${(me.hp / S.meta.hp) * 100}%"></i><em>${esc(me.name)}</em><b>${me.hp}</b></div>
    </div>
    ${voiceHTML()}
  `;
}

function mDoBuild(pi,i){
 const t=MT[i],ow=M.own[i],p=M.ps[pi];if(!ow||ow.o!==pi||t.t!=='p'||ow.lv>=5||!full(pi,t.g))return false;
 const G=grp(t.g);if(G.some(j=>M.own[j].mg))return false;
 if(ow.lv!==Math.min(...G.map(j=>M.own[j].lv))||p.cash<t.h)return false;
 if(ow.lv<4){if(M.bank.h<1)return false;M.bank.h--}else{if(M.bank.H<1)return false;M.bank.H--;M.bank.h+=4}
 p.cash-=t.h;ow.lv++;mc('pop');return true;
}
function mDoSell(pi,i){
 const t=MT[i],ow=M.own[i];if(!ow||ow.o!==pi||t.t!=='p'||ow.lv<1)return false;
 if(ow.lv!==Math.max(...grp(t.g).map(j=>M.own[j]?M.own[j].lv:0)))return false;
 const prev=ow.lv;
 if(prev===5){M.bank.H++;if(M.bank.h>=4){M.bank.h-=4;ow.lv=4}else ow.lv=0}else{M.bank.h++;ow.lv--}
 M.ps[pi].cash+=Math.floor(t.h/2)*(prev-ow.lv);mc('coin');return true;
}
function mDoMort(pi,i){

 if(t.t==='p'&&grp(t.g).some(j=>M.own[j]&&M.own[j].lv>0))return false;
 ow.mg=true;M.ps[pi].cash+=t.m;mc('coin');return true;
}
function mDoUnmort(pi,i){

const tryP=el=>{try{const p=el.play();return p&&p.then?p:Promise.resolve()}catch(e){return Promise.reject(e)}};
function play(){want=true;Promise.all([tryP(vid)].concat(hasA?[tryP(aud)]:[])).then(()=>{needTap=false;ui()}).catch(e=>{if(e&&e.name==='NotAllowedError'){needTap=true;ui()}})}
function pause(){want=false;vid.pause();aud.pause();ui()}
function seek(t){if(!isFinite(t))return;userSeekAt=Date.now();if(vid.readyState<1){pend={ct:t,p:!!pend&&pend.p};return}try{vid.currentTime=Math.max(0,t);if(hasA)aud.currentTime=Math.max(0,t)}catch(e){}}
function setEl(){const el=hasA?aud:vid;el.volume=Math.max(0,Math.min(1,vol*duck))}
function applyVol(){const el=hasA?aud:vid;el.volume=Math.max(0,Math.min(1,vol*duck));el.muted=muted;vid.muted=hasA?true:muted;g('mvVol').value=Math.round(vol*100);ui()}
function dur(){return isFinite(vid.duration)?vid.duration:0}
function fmt(s){if(!isFinite(s)||s<0)s=0;s=Math.floor(s);const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}
let aheadS=0;
function prev(f){const d=dur();g('mvPro').style.width=f*100+'%';g('mvKnob').style.left=f*100+'%';g('mvTime').textContent=fmt(f*d)+' / '+fmt(d)+(aheadS>=1?' · ⏳'+(aheadS>=60?Math.floor(aheadS/60)+'dk':Math.round(aheadS)+'sn'):'')}
function ui(){
 const paused=vid.paused;
 g('mvPP').innerHTML=svg(paused?IC.play:IC.pause,26);
 g('mvBig').innerHTML=svg(IC.play,44);g('mvBig').classList.toggle('on',st.on&&(isHostMe()?(paused||needTap):needTap)&&!buffering&&!g('mvMsg').classList.contains('on'));
 g('mvMute').innerHTML=svg(muted||vol===0?IC.mute:IC.vol,24);g('mvFs').innerHTML=svg(IC.fs,22)}
function tick(){if(seeking)return;const d=dur();if(vid.currentTime>1&&!vid.seeking)lastGood=vid.currentTime;aheadS=0;try{const b=vid.buffered,c0=vid.currentTime;for(let i=0;i<b.length;i++)if(c0>=b.start(i)-.3&&c0<=b.end(i)){aheadS=b.end(i)-c0;break}}catch(e){}prev(d?vid.currentTime/d:0);
 try{const b=vid.buffered;if(b.length&&d)g('mvBuf').style.width=Math.min(100,b.end(b.length-1)/d*100)+'%'}catch(e){}}
['play','pause'].forEach(e=>vid.addEventListener(e,ui));
vid.addEventListener('timeupdate',tick);vid.addEventListener('durationchange',tick);vid.addEventListener('progress',tick);
vid.addEventListener('waiting',()=>{buffering=true;g('mvSpin').classList.add('on');ui();if(hasA)aud.pause()});
vid.addEventListener('playing',()=>{buffering=false;g('mvSpin').classList.remove('on');msg('',false);if(hasA&&want&&aud.paused)tryP(aud).catch(()=>{});ui()});
vid.addEventListener('canplay',()=>{buffering=false;g('mvSpin').classList.remove('on');ui()});
vid.addEventListener('seeked',()=>{if(Date.now()-userSeekAt>2500&&vid.currentTime<2&&lastGood>8){const t=lastGood;userSeekAt=Date.now();try{vid.currentTime=t;if(hasA)aud.currentTime=t}catch(e){}}});
vid.addEventListener('ended',()=>{want=false;aud.pause();ui()});
vid.addEventListener('loadedmetadata',()=>{msg('',false);g('mvSpin').classList.remove('on');tick();if(pend){const p=pend;pend=null;if(p.ct>1)seek(p.ct);if(p.p)play()}ui()});
vid.addEventListener('error',()=>{if(!st.on||!vid.getAttribute('src')&&!hv)return;
 if(!tried&&!hv){tried=true;attach(vid,st.v,'v',true,st.sid);return}
 const c=vid.error?vid.error.code:0;fail('v',c?'code '+c:'')});
aud.addEventListener('error',()=>{if(st.on&&hasA&&aud.getAttribute('src'))fail('a','')});
setInterval(()=>{if(!st.on||!hasA||vid.paused||vid.seeking)return;if(Math.abs(aud.currentTime-vid.currentTime)>.6)aud.currentTime=vid.currentTime;if(want&&aud.paused)tryP(aud).catch(()=>{})},1000);

/* takilma bekcisi: oynarken ilerlemiyorsa kademeli mudahale */
let wdT=-1,wdN=0;
setInterval(()=>{if(!st.on||vid.paused||vid.seeking||!vid.readyState||S.screen!=='mov'){wdN=0;return}
 if(Math.abs(vid.currentTime-wdT)<.05){wdN++;
  if(wdN===2){try{vid.currentTime+=.1}catch(e){}}
  else if(wdN===4&&hv){try{hv.recoverMediaError()}catch(e){}}
  else if(wdN===7&&hv){try{hv.startLoad(vid.currentTime)}catch(e){}}
 }else wdN=0;wdT=vid.currentTime},1500);
/* ---- ağ ---- */
const send=(k,x)=>{if(NET.on)netSend(Object.assign({t:'mov',k,sid:st.sid},x||{}))};
const hostState=()=>({ct:vid.currentTime||0,p:!vid.paused&&!buffering&&vid.readyState>=3&&!vid.seeking});
const bcast=()=>{if(NET.on&&NET.host&&st.on)send('sync',hostState())};
const uPlay=()=>{if(!isHostMe())return;lastAct=Date.now();play();send('sync',{ct:vid.currentTime,p:true})};
const uPause=()=>{if(!isHostMe())return;lastAct=Date.now();pause();send('sync',{ct:vid.currentTime,p:false})};
const uSeek=t=>{if(!isHostMe())return;const d=dur();t=Math.max(0,d?Math.min(d-.5,t):t);lastAct=Date.now();seek(t);send('sync',{ct:t,p:!vid.paused,sk:1})};
const toggle=()=>{if(!isHostMe()){if(needTap)follow(true);return}vid.paused||needTap?uPlay():uPause()};
/* İzleyici: yöneticinin durumunu sürekli takip eder (oynat/durdur/süre) */
function follow(force){
 if(isHostMe()||!st.on||!hostT)return;
 const now=Date.now(),d=dur(),exp=hostT.ct+(hostT.p?(now-hostT.at)/1000:0),tgt=d?Math.min(exp,Math.max(0,d-.3)):exp;
 if(vid.readyState<1){pend={ct:tgt,p:hostT.p};return}
 if(seeking||vid.seeking)return;
 const diff=vid.currentTime-tgt,buf=buffering||vid.readyState<3;
 if(hostT.p){
  if(!buf&&Math.abs(diff)>3&&now-fixAt>4000){fixAt=now;seek(tgt+.3)}
  else if(!buf&&Math.abs(diff)>.6&&!vid.paused){vid.playbackRate=diff>0?.93:1.07}
  else vid.playbackRate=1;
  if(vid.paused&&(!needTap||force))play();
 }else{
  vid.playbackRate=1;
  if(!vid.paused||!aud.paused)pause();
  if(Math.abs(diff)>.4&&now-fixAt>800){fixAt=now;seek(tgt)}
 }
 if(hasA)aud.playbackRate=vid.playbackRate}
setInterval(()=>follow(false),500);
function load(d){
 st.on=true;st.title=d.title||'';st.v=d.v;st.a=d.a||'';st.sid=d.sid;hasA=!!st.a;want=false;tried=false;needTap=false;buffering=false;
 if(S.meta)S.meta.game='movie';
 vid.pause();aud.pause();pend={ct:d.ct||0,p:!!d.p};hostT=isHostMe()?null:{ct:d.ct||0,p:!!d.p,at:Date.now()};fixAt=0;vid.playbackRate=1;
 openScreen();applyVol();msg(L('Film yükleniyor…','Loading…'),true);g('mvSpin').classList.add('on');prev(0);g('mvBuf').style.width='0';
 attach(vid,st.v,'v',false,st.sid);if(hasA)attach(aud,st.a,'a',false,st.sid);else kill('a');
 applyVol();texts();if(!isHostMe())setTimeout(()=>send('ask'),1200)}
function recv(d){
 if(d.k==='react'){floatE(d.e);return}
 if(d.k==='load'){load(d);return}
 if(!st.on||d.sid!==st.sid)return;
 if(d.k==='sync'&&!isHostMe()){hostT={ct:d.ct,p:!!d.p,at:Date.now()};if(d.sk)fixAt=0;follow(false)}}
function begin(title,v,a){const d={title,v,a,sid:Date.now(),ct:0,p:false};load(d);if(NET.on)netSend(Object.assign({t:'mov',k:'load'},d))}
setInterval(()=>{if(st.on&&NET.on&&NET.host&&S.screen==='mov'&&vid.readyState>0)bcast()},1500);
['waiting','playing','seeked','pause','play'].forEach(e=>vid.addEventListener(e,()=>{if(isHostMe())bcast()}));
['loadedmetadata','canplay','playing'].forEach(e=>vid.addEventListener(e,()=>follow(false)));
/* Sesli sohbet varken film sesi otomatik kısılır (sohbet sesi sabit kalır) */
setInterval(()=>{if(!st.on)return;const n=performance.now();let sp=VOICE.on&&VOICE.talk>0;if(!sp)for(const k in NET.rx){const o=NET.rx[k];if(o&&(o.hold||0)>n){sp=true;break}}
 const tg=sp?.3:1;if(Math.abs(duck-tg)>.01){duck+=(tg-duck)*(tg<duck?.5:.12);setEl()}},120);

/* ---- arayüz ---- */
function openScreen(){show('mov');texts();people();ui()}
function isHostMe(){return !NET.on||NET.host}
function texts(){
 g('mvLogo').textContent=L('FİLM ODASI','MOVIE ROOM');
 g('mvCode').textContent='# '+(S.code||'');g('mvLeave').textContent=t('leave');
 g('mvName').textContent=st.title;g('mvTitleO').textContent=st.title;
 g('mvChange').textContent=L('Filmi değiştir','Change movie');g('mvChange').style.display=isHostMe()?'':'none';
 g('mvPT').textContent=L('İzleyiciler','Viewers');g('mvMicTx').textContent=t('mic');
 g('mvHint').textContent=isHostMe()?L('Oynat, durdur ve ileri sarmayı sadece sen yapabilirsin; izleyiciler seni otomatik takip eder. Konuşurken film sesi kısılır.','Only you can play, pause and seek; viewers follow you automatically. Film volume dips while people talk.'):L('Oynatmayı oda sahibi kontrol eder, görüntü sana otomatik senkron olur. Konuşmak için mikrofonu aç; film sesi konuşurken kısılır.','The host controls playback and you stay in sync automatically. Turn on the mic to talk; film volume dips while people talk.');g('mov').classList.toggle('vwr',!isHostMe());
 g('mvCopy').textContent=t('copyLink');
 const mi=g('micIcM');if(mi)mi.innerHTML=px('mic','#fff',2)}
function people(){
 if(S.screen!=='mov')return;const arr=Object.values(S.players),sig=arr.map(p=>p.id+p.name).join('|')+ST.lang;if(sig===psig)return;psig=sig;
 g('mvCnt').textContent=arr.length;
 g('mvList').innerHTML=arr.map(p=>`<div class="mvP">${avCanvas(p.id)}<b>${esc(p.name)}</b>${p.id===UID?`<span class="tag2">${t('you')}</span>`:''}${badge(isHost(p)?'host':'player',true)}${p.id!==UID?`<div class="mvPr">🔊<input type="range" class="mvPV" data-u="${p.id}" min="0" max="200" value="${Math.round((VVOL[p.id]==null?1:VVOL[p.id])*100)}"><span>${Math.round((VVOL[p.id]==null?1:VVOL[p.id])*100)}%</span></div>`:''}</div>`).join('');
 g('mvStrip').innerHTML=arr.map(p=>avCanvas(p.id)).join('');
 setTimeout(avRepaintAll,0)}
function showCtl(){wrap.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>{if(!vid.paused&&!seeking)wrap.classList.add('hide')},3000)}
wrap.addEventListener('pointermove',showCtl);wrap.addEventListener('pointerdown',showCtl);wrap.addEventListener('pointerleave',()=>{clearTimeout(hideT);hideT=setTimeout(()=>{if(!vid.paused)wrap.classList.add('hide')},800)});
vid.addEventListener('click',toggle);vid.addEventListener('dblclick',fs);
g('mvBig').onclick=toggle;g('mvPP').onclick=toggle;
g('mvBk').onclick=()=>uSeek(vid.currentTime-10);g('mvFw').onclick=()=>uSeek(vid.currentTime+10);
g('mvMute').onclick=()=>{muted=!muted;applyVol()};
g('mvVol').oninput=e=>{vol=e.target.value/100;muted=false;applyVol()};
function fs(){const d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const f=wrap.requestFullscreen||wrap.webkitRequestFullscreen;if(f)f.call(wrap);else if(vid.webkitEnterFullscreen)vid.webkitEnterFullscreen()}}
g('mvFs').onclick=fs;
const sk=g('mvSeek'),frac=e=>{const r=sk.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
sk.addEventListener('pointerdown',e=>{if(!dur()||!isHostMe())return;seeking=true;try{sk.setPointerCapture(e.pointerId)}catch(x){}prev(frac(e))});
sk.addEventListener('pointermove',e=>{if(seeking)prev(frac(e))});
sk.addEventListener('pointerup',e=>{if(!seeking)return;seeking=false;uSeek(frac(e)*dur())});
sk.addEventListener('pointercancel',()=>{seeking=false});
document.addEventListener('keydown',e=>{if(S.screen!=='mov'||/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||''))return;
 if(e.key===' '){e.preventDefault();toggle()}else if(e.key==='ArrowLeft')uSeek(vid.currentTime-10);else if(e.key==='ArrowRight')uSeek(vid.currentTime+10);
 else if(e.key==='f'||e.key==='F')fs();else if(e.key==='m'||e.key==='M'){muted=!muted;applyVol()}});
const cp=txt=>(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()});
const link=()=>location.origin+location.pathname+'?room='+S.code;
g('mvCode').onclick=()=>cp(S.code).then(()=>toast(t('copied'),'ok'));
g('mvCopy').onclick=()=>cp(link()).then(()=>toast(t('linkCopied'),'ok'));
const RE=['😂','😮','❤️','👏','🔥'];
g('mvReact').innerHTML=RE.map(e=>`<button class="btn" data-e="${e}" type="button">${e}</button>`).join('');
function floatE(e){if(!RE.includes(e))return;const s=document.createElement('span');s.className='mvFl';s.textContent=e;s.style.left=(8+Math.random()*80)+'%';wrap.appendChild(s);setTimeout(()=>s.remove(),2300)}
g('mvReact').onclick=ev=>{const b=ev.target.closest('[data-e]');if(!b)return;floatE(b.dataset.e);send('react',{e:b.dataset.e})};
g('mvList').addEventListener('input',e=>{const r=e.target.closest('.mvPV');if(!r)return;const u=r.dataset.u,v=r.value/100;VVOL[u]=v;try{localStorage.setItem('vvol',JSON.stringify(VVOL))}catch(x){}const o=NET.rx[u];if(o&&o.vg)o.vg.gain.value=vGain(u);else if(o)o.a.volume=Math.min(1,vGain(u));r.nextElementSibling.textContent=r.value+'%'});
setInterval(()=>{if(VOICE.on&&NET.on&&S.code)callAll()},6000);

 a.children[1].textContent=L('Oyun Odası','Game Room');a.children[2].textContent=L('Neredeyim, UNO, Monopoly…','Geo, UNO, Monopoly…');

 g('rtX').textContent=L('Vazgeç','Cancel');g('rtModal').classList.add('show')}
function openForm(mode){
 fmode=mode;g('rtModal').classList.remove('show');

 g('mvfL1').textContent=L('Film adı','Movie title');g('mvfL2').textContent=L('Video linki','Video link');
 g('mvfL3').textContent=L('Video ve ses ayrı link','Video and audio are separate links');g('mvfL4').textContent=L('Ses linki','Audio link');
 g('mvfT').placeholder=L('Örn: Gora','e.g. Gora');g('mvfV').placeholder='https://…/master.txt, .m3u8, .mp4';g('mvfA').placeholder='https://…';
 g('mvfHint').textContent=L('.mp4 ve HLS (.m3u8 / master.txt) linkleri desteklenir. Bazı linkler birkaç saat sonra geçersiz olur; film yarıda kesilirse yeni link ekle.','.mp4 and HLS (.m3u8 / master.txt) links work. Some links expire after a while; add a fresh one if playback stops.');

 const title=g('mvfT').value.trim().slice(0,80),v=g('mvfV').value.trim(),sep=g('mvfS').checked,a=sep?g('mvfA').value.trim():'',ok=u=>/^https?:\/\//i.test(u);
 if(!title)return toast(L('Film adını yaz','Enter the movie title'),'err');
 if(!ok(v))return toast(L('Geçerli bir video linki gir (http/https)','Enter a valid video link'),'err');
 if(sep&&!ok(a))return toast(L('Geçerli bir ses linki gir (http/https)','Enter a valid audio link'),'err');
 g('mvForm').classList.remove('show');
 if(fmode==='create'){if(!createRoom())return;if(S.pre){S.pre.p.then(x=>x.frame.remove());S.pre=null}S.meta.game='movie';netHost()}
 begin(title,v,a)};
addEventListener('load',()=>{$('#btnCreate').onclick=()=>{if(!getName())return;openType()}});

function stop(){st.on=false;want=false;pend=null;vid.pause();aud.pause();kill('v');kill('a');hasA=false;psig='';msg('',false);g('mvSpin').classList.remove('on');const d=document;if(d.fullscreenElement)d.exitFullscreen().catch(()=>{})}
window.MOV={on:()=>st.on,stop,recv,people:()=>{psig='';people()},
 sendTo:c=>{try{c.send({t:'mov',k:'load',title:st.title,v:st.v,a:st.a,sid:st.sid,ct:vid.currentTime||0,p:hostState().p})}catch(e){}},
 hostIn:(c,d)=>{if(d.k==='react'&&RE.includes(d.e)){floatE(d.e);netSend({t:'mov',k:'react',e:d.e},c);return}if(d.k==='ask'&&st.on){try{c.send(Object.assign({t:'mov',k:'sync',sid:st.sid},hostState()))}catch(e){}}}};
})();

/* Kartlar ekrandan taşmasın: el kalabalıklaştıkça kartlar daha çok üst üste biner */
(function(){
 const FITS=[['.uHand','.uc',-16],['.kHand','.kc.h',-26],['.kRow','.kc.s',-30]];
 let raf=0;
 function fit(){raf=0;const r=document.getElementById('xgRoot');if(!r)return;
  FITS.forEach(([hs,cs,def])=>r.querySelectorAll(hs).forEach(h=>{
   const cards=h.querySelectorAll(cs),n=cards.length;if(!n)return;
   const cs0=getComputedStyle(h),av=h.clientWidth-parseFloat(cs0.paddingLeft)-parseFloat(cs0.paddingRight)-(hs==='.kRow'?0:0);
   const w=cards[0].offsetWidth;if(!w||av<=0)return;
   let m=n>1?(av-w)/(n-1)-w:0;m=Math.min(h.classList.contains('tight')&&hs==='.kHand'?-40:def,m);
   m=Math.max(m,-w+6);
   cards.forEach((c,i)=>{c.style.marginLeft=i?m.toFixed(1)+'px':'0px'})}))}
 const sched=()=>{if(!raf)raf=requestAnimationFrame(fit)};
 function init(){const r=document.getElementById('xgRoot');if(!r)return setTimeout(init,500);
  new MutationObserver(sched).observe(r,{childList:true,subtree:true});
  r.addEventListener('load',sched,true);window.addEventListener('resize',sched);window.addEventListener('orientationchange',sched);sched()}
 init();
})();
